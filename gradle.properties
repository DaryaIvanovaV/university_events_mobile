# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9 має вбудовану підтримку Kotlin і за замовчуванням забороняє додавати
# джерела через kotlin.sourceSets. KSP (генератор коду Room) саме так і реєструє
# свій каталог build/generated/ksp, тому без цього прапорця конфігурація падає з
# «Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin».
# Прибрати можна буде, коли KSP навчиться реєструватися через android.sourceSets.
android.disallowKotlinSourceSets=false

# ─── Конфігурація застосунку ───────────────────────────────────────────────────
# Ці значення потрапляють у BuildConfig через buildConfigField у app/build.gradle.kts.
# У коді їх читає лише core/config/AppConfig.kt — жодних URL чи назв тем у композаблах.

# 10.0.2.2 — це адреса машини розробника, якою її бачить емулятор Android.
# `localhost` всередині емулятора вказує на сам емулятор, а не на хост.
#
# Активний варіант — LAN-IP цієї машини: він працює І на фізичному телефоні,
# І на емуляторі. 10.0.2.2 нижче лишено на випадок роботи без Wi-Fi: це адреса,
# яка існує лише всередині емулятора, і телефон до неї не достукається.
#
# Backend живе в Docker Compose і вже мапить порт на 0.0.0.0 — окремо запускати
# uvicorn НЕ треба й не вийде, порт 8000 буде зайнятий. Підняти стек:
#   cd C:\Users\HuGox\PycharmProjects\EventParser
#   docker compose --env-file .env.docker up -d
#
# Для телефона додатково: він має бути в тій самій мережі Wi-Fi, а у фаєрволі
# Windows потрібне правило EventParser-API-8000 (вхідне, TCP 8000).
#
# IP видано по DHCP. Якщо зміниться — правити В ДВОХ місцях: тут і в
# app/src/debug/res/xml/network_security_config.xml.
eventsparser.baseUrl.debug=http://192.168.0.109:8000
#eventsparser.baseUrl.debug=http://10.0.2.2:8000

# Заглушка для релізу — замінити на реальний хост із HTTPS.
eventsparser.baseUrl.release=https://events.example.org

# Тема FCM за замовчуванням. Сервер валідує назву за [a-zA-Z0-9-_.~%]+ (інакше 422).
eventsparser.fcmTopic=conferences

# Розмір сторінки стрічки GET /events (сервер дозволяє 1…500).
eventsparser.feedPageSize=100

# Розмір сторінки GET /events/sync (за замовчуванням 500, максимум 1000;
# діє на сумарну кількість записів у changed + removed).
eventsparser.syncPageSize=500